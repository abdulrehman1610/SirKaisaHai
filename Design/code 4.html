<script>
        // Simple star rating interaction
        document.querySelectorAll('.star-rating').forEach(ratingGroup => {
            const stars = ratingGroup.querySelectorAll('span');
            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    stars.forEach((s, i) => {
                        if (i <= index) {
                            s.classList.add('active');
                            s.style.fontVariationSettings = "'FILL' 1";
                        } else {
                            s.classList.remove('active');
                            s.style.fontVariationSettings = "'FILL' 0";
                        }
                    });
                });
            });
        });

        // Simple grade pill selection
        document.querySelectorAll('button').forEach(btn => {
            if(btn.textContent.trim().length <= 2 || btn.textContent.trim() === 'Other') {
                btn.addEventListener('click', (e) => {
                    const parent = e.target.parentElement;
                    if(parent.classList.contains('flex-wrap')) {
                        parent.querySelectorAll('button').forEach(b => {
                            b.classList.remove('bg-secondary-fixed', 'border-primary', 'text-primary');
                            b.classList.add('bg-surface', 'border-secondary-container', 'text-on-surface');
                        });
                        e.target.classList.remove('bg-surface', 'border-secondary-container', 'text-on-surface');
                        e.target.classList.add('bg-secondary-fixed', 'border-primary', 'text-primary', 'font-semibold');
                    }
                })
            }
        });
    </script>
